services:
  - type: web
    name: smarthire-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && ls node_modules/@types && npm run build

    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

      # ⛔️ Replace these with actual values via Render Dashboard (don't push secrets to GitHub)
      - key: MONGO_URI
        value: <REPLACE_WITH_MONGODB_ATLAS_URI>

      - key: OPENROUTER_API_KEY
        value: <REPLACE_WITH_OPENROUTER_API_KEY>

      - key: JWT_SECRET
        value: <REPLACE_WITH_STRONG_SECRET_KEY>

      - key: RESEND_API_KEY
        value: <RESEND_API_KEY_FOR_EMAIL_RESET>

      - key: RESEND_FROM_EMAIL
        value: <RESEND_FROM_EMAIL_FOR_EMAIL_RESET>
